<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0a1a" />
      <stop offset="50%" stop-color="#140f2d" />
      <stop offset="100%" stop-color="#070612" />
    </linearGradient>

    <linearGradient id="neonGlow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="50%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <linearGradient id="neonGlow2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="ambientBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -1px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #b3b9d6;
      letter-spacing: 0.2px;
    }
    .badge-pill {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #00f0ff;
    }
    .badge-pill-2 {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #ff4df0;
    }
    .eq-bar {
      transform-origin: bottom;
      animation: eqBounce 1.8s ease-in-out infinite alternate;
    }
    @keyframes eqBounce {
      0% { transform: scaleY(0.25); }
      50% { transform: scaleY(1.0); }
      100% { transform: scaleY(0.4); }
    }
    .wave-float {
      animation: waveFloat 8s ease-in-out infinite alternate;
    }
    @keyframes waveFloat {
      0% { transform: translateX(0px) translateY(0px); }
      100% { transform: translateX(-40px) translateY(10px); }
    }
    .orb-pulse {
      animation: orbPulse 6s ease-in-out infinite alternate;
    }
    @keyframes orbPulse {
      0% { transform: scale(1); opacity: 0.45; }
      100% { transform: scale(1.2); opacity: 0.75; }
    }
    .note-float {
      animation: noteFloat 4s ease-in-out infinite;
    }
    @keyframes noteFloat {
      0% { transform: translateY(0px); opacity: 0.2; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-30px); opacity: 0; }
    }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Background Animated Glowing Orbs -->
  <g filter="url(#ambientBlur)">
    <circle cx="200" cy="100" r="130" fill="#7928ca" class="orb-pulse" />
    <circle cx="1020" cy="300" r="140" fill="#ff007f" class="orb-pulse" style="animation-delay: -3s;" />
    <circle cx="650" cy="50" r="110" fill="#00f0ff" class="orb-pulse" style="animation-delay: -1.5s;" />
  </g>

  <!-- Cyber Grid Pattern in Background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Background Synthesizer Waveform Visualizer -->
  <g opacity="0.4" class="wave-float">
    <path d="M-50,340 C 150,220 300,380 500,260 C 700,160 850,360 1050,250 C 1150,200 1220,310 1300,270" 
          fill="none" stroke="url(#neonGlow1)" stroke-width="3" filter="url(#glow)" />
    <path d="M-50,360 C 120,290 280,390 480,300 C 680,210 820,380 1020,300 C 1140,240 1210,330 1300,310" 
          fill="none" stroke="url(#neonGlow2)" stroke-width="2" opacity="0.6" />
  </g>

  <!-- Equalizer Spectrum Bars (Bottom Right Backdrop) -->
  <g transform="translate(820, 370) scale(1, -1)" opacity="0.6">
    <rect x="0" y="0" width="7" height="60" rx="3.5" fill="#ff007f" class="eq-bar" style="animation-delay: -0.2s;" />
    <rect x="12" y="0" width="7" height="95" rx="3.5" fill="#e0129a" class="eq-bar" style="animation-delay: -0.7s;" />
    <rect x="24" y="0" width="7" height="130" rx="3.5" fill="#bd22b8" class="eq-bar" style="animation-delay: -1.3s;" />
    <rect x="36" y="0" width="7" height="170" rx="3.5" fill="#9933d6" class="eq-bar" style="animation-delay: -0.4s;" />
    <rect x="48" y="0" width="7" height="110" rx="3.5" fill="#7845f0" class="eq-bar" style="animation-delay: -1.1s;" />
    <rect x="60" y="0" width="7" height="145" rx="3.5" fill="#545cfb" class="eq-bar" style="animation-delay: -0.9s;" />
    <rect x="72" y="0" width="7" height="190" rx="3.5" fill="#2d77ff" class="eq-bar" style="animation-delay: -0.1s;" />
    <rect x="84" y="0" width="7" height="125" rx="3.5" fill="#0095ff" class="eq-bar" style="animation-delay: -1.5s;" />
    <rect x="96" y="0" width="7" height="160" rx="3.5" fill="#00b5ff" class="eq-bar" style="animation-delay: -0.6s;" />
    <rect x="108" y="0" width="7" height="100" rx="3.5" fill="#00d5ff" class="eq-bar" style="animation-delay: -1.2s;" />
    <rect x="120" y="0" width="7" height="140" rx="3.5" fill="#00f0ff" class="eq-bar" style="animation-delay: -0.5s;" />
    <rect x="132" y="0" width="7" height="80" rx="3.5" fill="#00f0ff" class="eq-bar" style="animation-delay: -0.8s;" />
  </g>

  <!-- Ambient Musical Symbols Floating in Background -->
  <g fill="#00f0ff" opacity="0.3" class="note-float" style="animation-delay: 0s;">
    <path transform="translate(180, 260) scale(1.3)" d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
  </g>
  <g fill="#ff007f" opacity="0.3" class="note-float" style="animation-delay: -2s;">
    <path transform="translate(980, 140) scale(1.4)" d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
  </g>

  <!-- FOREGROUND CONTENT: Header Tag, Title, Subtitle & Interactive Feature Pills -->
  <g transform="translate(80, 0)">
    <!-- Top Pill Category Badge -->
    <g transform="translate(0, 60)">
      <rect width="260" height="34" rx="17" fill="url(#cardGrad)" stroke="#7928ca" stroke-width="1.2" />
      <circle cx="18" cy="17" r="5" fill="#00f0ff">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="22" class="badge-pill">AI AUDIO &amp; MUSIC ECOSYSTEM</text>
    </g>

    <!-- Main Title with Bright Gradient Accent -->
    <text x="0" y="150" class="title-text">
      Awesome AI Music Generation
    </text>
    <text x="0" y="200" class="title-text">
      &amp; <tspan fill="url(#neonGlow1)">Songwriting</tspan> 🎵
    </text>

    <!-- Subtitle / Meta Description -->
    <text x="0" y="246" class="subtitle-text">
      Curated directory of foundation models, text-to-song lyrics generators,
    </text>
    <text x="0" y="274" class="subtitle-text">
      neural singing synthesizers, stem separation tools &amp; music DAW pipelines.
    </text>

    <!-- Feature Tags Row in Foreground -->
    <g transform="translate(0, 316)">
      <!-- Pill 1 -->
      <g>
        <rect width="135" height="36" rx="8" fill="url(#cardGrad)" stroke="#ff007f" stroke-width="1.2" />
        <text x="18" y="23" class="badge-pill-2">✨ Lyrics-to-Song</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(150, 0)">
        <rect width="150" height="36" rx="8" fill="url(#cardGrad)" stroke="#00f0ff" stroke-width="1.2" />
        <text x="18" y="23" class="badge-pill">🎤 Vocal Synthesis</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(315, 0)">
        <rect width="155" height="36" rx="8" fill="url(#cardGrad)" stroke="#7928ca" stroke-width="1.2" />
        <text x="18" y="23" style="fill: #d8b4fe; font-family: -apple-system, sans-serif; font-weight: 600; font-size: 13px;">🎛️ Stem Isolation</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(485, 0)">
        <rect width="155" height="36" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" />
        <text x="18" y="23" class="badge-pill">🎼 MIDI &amp; Scoring</text>
      </g>
    </g>
  </g>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
</svg>